services:
  soc:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:-analyst123}
    volumes:
      - soc-data:/data
volumes:
  soc-data:
